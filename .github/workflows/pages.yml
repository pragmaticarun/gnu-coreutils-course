name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Choose base path
        id: base
        env:
          BASE_PATH_VAR: ${{ vars.BASE_PATH }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$BASE_PATH_VAR" = "/" ]; then
            path=""
          elif [ -n "$BASE_PATH_VAR" ]; then
            path="${BASE_PATH_VAR%/}"
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            path=""
          else
            path="/${REPO}"
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "Next base path: '${path}'"

      - name: Install and build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: |
          set -euo pipefail
          test -f content/generated/course.json
          test -f public/benchmarks/sample-run.json
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
